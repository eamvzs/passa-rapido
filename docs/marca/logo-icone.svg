<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B6C9F"/>
      <stop offset="1" stop-color="#0F2447"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#fundo)"/>
  <rect width="100" height="50" rx="24" fill="url(#brilho)"/>
  <!-- linhas de movimento: "rápido" -->
  <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3.2" stroke-linecap="round">
    <path d="M9 38 H19"/>
    <path d="M6 48 H17"/>
    <path d="M10 58 H20"/>
  </g>
  <!-- pino de localização: "unidade" -->
  <path d="M54 88 C54 88 28 64 28 45 A26 26 0 0 1 80 45 C80 64 54 88 54 88 Z" fill="#FFFFFF"/>
  <circle cx="54" cy="45" r="17.5" fill="#1E4076"/>
  <!-- avanço rápido dentro do pino: "passa" -->
  <path d="M46 35 L55.5 45 L46 55 M56.5 35 L66 45 L56.5 55" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
